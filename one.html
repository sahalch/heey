<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="one">SelfStack</h1>
    <button onclick="color()">black</button>
    <button onclick="colores()">blue</button>
    <script>
        let a = document.getElementById("one")
        function color(){
            a.style.color = "blue";
        }function colores(){
            a.style.color = "black";
        }
    </script>
</body>
</html>
